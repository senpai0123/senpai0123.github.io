name: Actualizar videos de YouTube

on:
  schedule:
    - cron: "17 11,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar listas de YouTube
        run: python3 tools/fetch_videos.py
      - name: Guardar cambios
        run: |
          if ! git diff --quiet -- data/videos.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/videos.json
            git commit -m "Actualizar videos de YouTube"
            git push
          fi
